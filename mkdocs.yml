site_name: Kaggle Research Lab
site_description: Machine Learning experiments, methodology & evolution
site_url: https://lumincc.github.io/kaggle-daily-lab/

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - tables

nav:
  - Home: index.md
  - Projects:
      - Titanic:
          - Overview: projects/titanic.md
          - v1: titanic/v1.md
          - v2: titanic/v2.md
          - v3: titanic/v3.md
          - v4: titanic/v4.md
      - House Prices: projects/house-prices.md
      - Digit Recognizer: projects/digit-recognizer.md
